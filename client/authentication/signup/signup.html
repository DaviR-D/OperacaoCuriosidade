<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../../theme.css">
    <link rel="stylesheet" href="../login/login.css">
    <link rel="stylesheet" href="signup.css">
    <script src="../../theme.js" defer></script>
</head>

<body>
    <main class="loginBox">
        <div id="navIconContainer">
            <p id="navIcon">OC</p>
            <p style="text-align: center;">Operação<br>Curiosidade</p>
        </div>
        <div id="loginInfo">
            <input type="text" id="name" maxlength="300" placeholder="Nome" />
            <input type="text" id="email" maxlength="300" placeholder="Email" />
            <input type="password" id="password" maxlength="300" placeholder="Senha" />
            <button id="login" onclick="trySignup()">REGISTRAR</button>
            <span id="errorMessage"></span>
        </div>

    </main>
</body>
<script src="../authentication.js" defer></script>
<script src="signup.js" defer></script>

</html>
