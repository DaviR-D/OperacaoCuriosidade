<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <header>
        <input type="text" placeholder="Pesquisar..." id="search">
        <div class="login">
            <span id="userDisplay"></span>
            <a href="../login/login.html" id="exit">SAIR</a>
        </div>
    </header>
    <nav>
        <p style="text-align: center;">Operação Curiosidade</p>
        <div class="navLinks">
            <p><a href="../dashboard/dashboard.html">Home</a></p>
            <p><a href="register.html">Cadastro</a></p>
            <p><a href="../report/report.html">Relatórios</a></p>
        </div>
    </nav>
    <main>
        <dialog id="registerWindow">
            <form id="registerForm">
                <div class="firstSection">
                    <div style="margin-left: 90%; margin-top: 5vh;">Ativo <input type="checkbox" id="status"></div>
                    <h1><strong>1° Fatos e dados</strong></h1>
                    <p>Nome</p>
                    <input type="text" id="name" required>
                    <p>Idade</p>
                    <input type="number" id="age" required>
                    <p>Email</p>
                    <input type="email" id="email" required>
                    <p>Endereço</p>
                    <input type="text" id="adress" required>
                    <p>Outras informações</p>
                    <input type="text" id="other" required>
                </div>
                <div class="formSection">
                    <h1><strong>2° Interesses</strong></h1>
                    <input type="" id="interests" required>
                </div>
                <div class="formSection">
                    <h1><strong>3° Sentimentos</strong></h1>
                    <input type="text" id="feelings" required>
                </div>
                <div class="formSection">
                    <h1><strong>4° Valores</strong></h1>
                    <input type="text" id="values" required>
                </div>
                <button type="submit" style="margin-top: 40px; padding: 10px;" onclick="saveRegistration()">GRAVAR</button>
            </form>
        </dialog>
        <article class="registrationsWraper" style="height: 95%; margin-top: 15px;">
            <div style="display: flex; padding: 15px;">
                <h1 style="padding-left: 30px;"><strong>Cadastros</strong></h1>
                <button id="registerButton" onclick="showRegisterWindow()">NOVO CADASTRO</button>
            </div>
            <div class="tableWraper">
                <table id="registrations"></table>
            </div>
        </article>
    </main>
</body>
<script src="../script.js"></script>
<script src="register.js"></script>

</html>
